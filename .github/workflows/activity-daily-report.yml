# Trigger the backend daily activity report (Zurich calendar day).

name: Send Daily Activity Report

on:
  schedule:
    # 22:58 UTC ≈ 23:58 Europe/Zurich in winter (CET). The API attributes the report
    # to the correct Zurich calendar day — see DailyReportService.ResolveTargetDay.
    - cron: '58 22 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Optional report day (YYYY-MM-DD, Europe/Zurich)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  send_daily_report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report endpoint
        env:
          REPORT_KEY: ${{ secrets.ACTIVITY_REPORT_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -z "$REPORT_KEY" ]; then
            echo "::error::Missing ACTIVITY_REPORT_KEY secret. Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Missing API_BASE_URL secret. Set it to the .NET App Service URL (e.g. https://pavillon46-api.azurewebsites.net)."
            exit 1
          fi

          API_BASE_URL="${API_BASE_URL%/}"
          URL="${API_BASE_URL}/api/activity/daily-report"
          if [ -n "$DAY" ]; then
            URL="${URL}?day=${DAY}"
          fi

          echo "Calling: ${URL}"
          RESPONSE="$(curl --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST \
            -H "x-report-key: ${REPORT_KEY}" \
            -H "Accept: application/json" \
            -w "\nHTTP_STATUS:%{http_code}" \
            "${URL}")"

          HTTP_STATUS="$(echo "$RESPONSE" | tail -n1 | sed 's/HTTP_STATUS://')"
          BODY="$(echo "$RESPONSE" | sed '$d')"

          echo "Status: ${HTTP_STATUS}"
          echo "Response: ${BODY}"

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Daily report request failed with HTTP ${HTTP_STATUS}"
            exit 1
          fi

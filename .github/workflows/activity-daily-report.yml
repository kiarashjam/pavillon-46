name: Send Daily Activity Report

on:
  schedule:
    # 22:58 UTC ≈ 23:58 Europe/Zurich in winter (CET). In summer (CEST) this is ~00:58 the next local day; the API
    # still attributes the report to the correct Zurich calendar day (see resolveTargetDay in daily-report.js).
    - cron: '58 22 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'Optional report day (YYYY-MM-DD, Europe/Zurich)'
        required: false
        type: string

jobs:
  send_daily_report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily report endpoint
        env:
          REPORT_KEY: ${{ secrets.ACTIVITY_REPORT_KEY }}
          SITE_URL: https://kind-hill-0e0617903.1.azurestaticapps.net
          DAY: ${{ github.event.inputs.day }}
        run: |
          if [ -z "$REPORT_KEY" ]; then
            echo "::error::Missing ACTIVITY_REPORT_KEY repository secret (must match Azure Application setting ACTIVITY_REPORT_KEY). Add it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          URL="$SITE_URL/api/activity/daily-report"
          if [ -n "$DAY" ]; then
            URL="$URL?day=$DAY"
          fi

          echo "Calling: $URL"
          curl --fail --silent --show-error \
            -X POST \
            -H "x-report-key: $REPORT_KEY" \
            "$URL"

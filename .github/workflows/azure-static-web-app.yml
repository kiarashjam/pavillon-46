# Build the Vite frontend and publish to Azure Static Web Apps.
# Generates staticwebapp.config.json so client-side routes work and /api/* is
# proxied to the .NET backend (API_BASE_URL secret).

name: Publish Frontend to Azure Static Web App

on:
  push:
    branches: [main, master]
    paths:
      - 'frontend/**'
      - 'azure/**'
      - '.github/workflows/azure-static-web-app.yml'
  workflow_dispatch:

concurrency:
  group: swa-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate deploy secrets
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN is not set. See azure/README.md."
            exit 1
          fi
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL is not set. Point it at the .NET App Service URL (e.g. https://pavillon46-api.azurewebsites.net)."
            exit 1
          fi

      - name: Generate staticwebapp.config.json
        working-directory: frontend
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          API_BASE_URL="${API_BASE_URL%/}"
          cat > public/staticwebapp.config.json <<EOF
          {
            "routes": [
              {
                "route": "/api/*",
                "allowedRoles": ["anonymous"],
                "rewrite": "${API_BASE_URL}/api/*"
              }
            ],
            "navigationFallback": {
              "rewrite": "/index.html",
              "exclude": [
                "/assets/*",
                "/*.css",
                "/*.js",
                "/favicon.ico",
                "/images/*",
                "/fonts/*"
              ]
            },
            "mimeTypes": {
              ".json": "application/json"
            },
            "globalHeaders": {
              "X-Content-Type-Options": "nosniff",
              "Referrer-Policy": "strict-origin-when-cross-origin"
            }
          }
          EOF
          echo "SWA config written (API proxy → ${API_BASE_URL})"

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true

# Build and publish the .NET 8 API to Azure App Service (Linux).

name: Publish Backend to Azure App Service

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'azure/**'
      - '.github/workflows/azure-backend-app-service.yml'
  workflow_dispatch:

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        env:
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$WEBAPP_NAME" ]; then
            echo "::error::AZURE_WEBAPP_NAME is not set (e.g. pavillon46-api)."
            exit 1
          fi
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::AZURE_WEBAPP_PUBLISH_PROFILE is not set. Download it from Azure Portal → App Service → Get publish profile."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & publish
        run: |
          dotnet restore Pavillon46.Api/Pavillon46.Api.csproj
          dotnet publish Pavillon46.Api/Pavillon46.Api.csproj \
            --configuration Release \
            --output ./publish \
            --no-restore

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/publish

      # Polls /health for up to 3 minutes while the new build starts, prints the
      # report, and fails the job unless it answers 200 (Healthy or Degraded;
      # 503 means Unhealthy). The host is API_BASE_URL when set, else the App
      # Service's default host.
      #
      # App Service's own health check (Configuration → Health check, path
      # /health) is set once by hand, not here: this workflow deploys with a
      # publish profile and never signs in to Azure, so it has no `az` session to
      # run `az webapp config set --generic-configurations '{"healthCheckPath": "/health"}'`.
      # See azure/README.md.
      - name: Smoke test /health
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          base="${API_BASE_URL%/}"
          if [ -z "$base" ]; then
            base="https://${WEBAPP_NAME:-pavillon46-api}.azurewebsites.net"
          fi
          url="${base}/health"
          report="${RUNNER_TEMP}/health.json"
          deadline=$((SECONDS + 180))
          echo "Polling ${url} for up to 3 minutes"
          while :; do
            rm -f "$report"
            code=$(curl --silent --show-error --max-time 20 --output "$report" --write-out '%{http_code}' "$url") || true
            code="${code:-000}"
            if [ "$code" = "200" ] || [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            echo "HTTP ${code}; retrying in 10s..."
            sleep 10
          done
          echo "HTTP ${code} from ${url}"
          if [ -s "$report" ]; then
            jq . "$report" 2>/dev/null || cat "$report"
            echo ""
          fi
          if [ "$code" != "200" ]; then
            echo "::error::/health answered HTTP ${code} after deploy (expected 200)."
            exit 1
          fi
          if jq -e '.status == "Degraded"' "$report" >/dev/null 2>&1; then
            echo "::warning::/health is Degraded: $(jq -r '[.checks[] | select(.status != "Healthy") | "\(.name): \(.description)"] | join(" ")' "$report")"
          fi
          echo "Health check passed"
